# Task system configuration read by the global workspace-kit
# (~/.agents/workspace-kit: task-worktree.sh, wait-for-ci.sh and the task/deploy skills).
# Plain KEY=value lines; values are not quoted. Unknown keys are refused.
# Fixed by the standard, not configurable: branches develop/staging/main, worktrees, GitHub origin.
# `~/.agents/workspace-kit/bin/task-worktree.sh config` prints every key resolved, with defaults.

# --- Tasks -------------------------------------------------------------------

# Workspace project key of this repository.
WORKSPACE_PROJECT_KEY=HEXM

# Runs inside a new task worktree after .env is copied (dependency install). Empty: nothing.
SETUP_CMD=bash scripts/worktree-setup.sh

# Closing gate run by /close-task. Empty: no automated gate.
CLOSE_CHECK_CMD=(cd app-laravel && composer ci:check) && (cd services/importer && uv run poe check)

# Runs in the primary checkout after a task is merged and its worktree removed. Empty: nothing.
POST_MERGE_CMD=(cd app-laravel && composer install --no-interaction --no-progress && php artisan migrate --force --no-interaction) && (cd services/importer && uv sync --frozen)

# Repositories sharing contracts with this one: space-separated KEY:path pairs.
RELATED_PROJECTS=

# --- Changelog (one file per change in changelog/unreleased/, aggregated into CHANGELOG.md) --------

# none | kit (the kit's changelog.mjs) | custom (the repository's own commands, below). Default none.
CHANGELOG=none
# custom only, e.g. pnpm run changelog:add -- / pnpm run changelog:build / pnpm run changelog:release --
#CHANGELOG_ADD_CMD=
#CHANGELOG_BUILD_CMD=
#CHANGELOG_RELEASE_CMD=
# Paths committed after regenerating. Default: CHANGELOG.md changelog/
#CHANGELOG_FILES=

# --- CI on pull requests -------------------------------------------------------------------------

# Workflow file whose PR run must pass before /close-task merges, or none. Default none.
CI_WAIT=none
# Job whose success is the pass (default ci); empty: the whole run's conclusion.
#CI_GATE_JOB=ci
# Jobs whose failure is reported at once, by name prefix (e.g. quick). Empty: none.
#CI_FAIL_FAST_PREFIX=

# --- Releases (/deploy-staging, /deploy-production) ----------------------------------------------

# develop -> staging (/deploy-staging) -> main (/deploy-production).
# branches (default: the skills drive the steps) | script (the repository's deploy script does).
RELEASE_MODE=branches
# File the version is stamped into (default VERSION; the kit changelog always writes VERSION).
#VERSION_FILE=VERSION
# Full suite run on develop before the version is sealed. Empty: none.
RELEASE_CHECK_CMD=(cd app-laravel && composer ci:check) && (cd services/importer && uv run poe check)
# CI workflow that runs on pushes to staging/main, waited for by the deploys. Empty: none.
#WORKFLOW_TESTS=
# Workflow fired by pushing the vX.Y.Z tag. Empty: none.
#WORKFLOW_RELEASE=
# ask (default) | yes — whether pushing the release tag needs confirmation.
#TAG_PUSH=ask
# no (default) | yes — publish a GitHub Release with the changelog section on production.
#GITHUB_RELEASE=no
# Repository document with manual steps after the production merge. Empty: none.
#PRODUCTION_RUNBOOK=
# script mode: `<cmd> <version> --dry-run|--yes` and `<cmd> --dry-run|--yes`.
#DEPLOY_STAGING_CMD=
#DEPLOY_PRODUCTION_CMD=
