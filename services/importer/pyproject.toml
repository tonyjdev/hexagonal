# ============================================================================
# pyproject.toml del servicio importer
# ============================================================================
#
# CONCEPTO: pyproject.toml (PEP 518 / PEP 621)
# Es el composer.json de Python: nombre y versión del proyecto, versión de
# Python que necesita, dependencias y la configuración de las herramientas
# (ruff, mypy, pytest...), todo en un único fichero TOML.
#
#   composer.json          ↔  pyproject.toml
#   composer.lock          ↔  uv.lock          (versiones exactas, se versiona)
#   vendor/                ↔  .venv/           (entorno virtual, NO se versiona)
#   composer install       ↔  uv sync
#   composer require x     ↔  uv add x
#   composer require --dev ↔  uv add --dev x
#   "scripts"              ↔  [tool.poe.tasks] (ver más abajo)
#
# La herramienta elegida para gestionarlo es uv (ADR 0021).
# ============================================================================

[project]
name = "importer"
version = "0.1.0"
description = "Lee los Excel de los planes nutricionales y los devuelve como JSON para Laravel."
readme = "README.md"
# Como "php": "^8.5" en composer.json. La versión exacta del intérprete la fija
# .python-version, que uv lee para crear el entorno virtual.
requires-python = ">=3.14"
# Dependencias de ejecución (como "require"). uv add las escribe aquí con una
# cota inferior; las versiones exactas quedan en uv.lock.
#   - fastapi: el framework web; uvicorn: el servidor ASGI que lo ejecuta.
#   - openpyxl: lee los .xlsx (como PhpSpreadsheet).
#   - defusedxml: openpyxl lo usa solo si está instalado, para leer el XML de
#     un .xlsx subido sin exponerse a XML malicioso (entidades externas...).
#   - python-multipart: FastAPI lo necesita para leer subidas (UploadFile).
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.163.1",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

# Dependencias solo de desarrollo (como "require-dev"): PEP 735, grupos de
# dependencias. uv instala el grupo "dev" por defecto con uv sync.
[dependency-groups]
dev = [
    "httpx2>=2.16.1",
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    # Tipos de openpyxl para mypy (openpyxl no los trae): un "stub package".
    "types-openpyxl>=3.1.5.20261017",
]

# ----------------------------------------------------------------------------
# Empaquetado
# ----------------------------------------------------------------------------
# CONCEPTO: src layout
# El código vive en src/importer/ y no en importer/ en la raíz. Así los tests
# importan el paquete INSTALADO en el entorno virtual (uv lo instala en modo
# editable), no la carpeta por estar en el directorio actual: si algo no está
# bien empaquetado, falla en los tests y no en producción. Es la misma idea que
# el "autoload" de composer.json: el código se encuentra porque está declarado,
# no por casualidad.
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# ----------------------------------------------------------------------------
# Tareas (el "scripts" de composer.json)
# ----------------------------------------------------------------------------
# CONCEPTO: task runner
# uv no tiene un equivalente a los scripts de Composer, así que se usa
# poethepoet (poe), que lee las tareas de esta sección. Se ejecutan dentro del
# entorno virtual con: uv run poe <tarea>. Los nombres copian los de
# app-laravel/composer.json para que la correspondencia sea evidente.
[tool.poe.tasks]
lint = { shell = "ruff check --fix . && ruff format .", help = "Corrige el formato y lo que ruff sepa arreglar (como composer lint)" }
"format:check" = { cmd = "ruff format --check .", help = "Comprueba el formato sin tocar nada (como Pint --test)" }
"lint:check" = { cmd = "ruff check .", help = "Reglas de estilo y errores probables" }
"types:check" = { cmd = "mypy", help = "Análisis estático estricto (como PHPStan al nivel max)" }
test = { cmd = "pytest", help = "Tests (como composer test)" }
# El Excel ficticio de tests/fixtures (pruebas manuales con curl) se genera con
# el mismo constructor que usan los tests (tests/workbooks.py).
fixtures = { cmd = "python tests/workbooks.py", help = "Regenera el Excel ficticio de tests/fixtures" }

# Gate de calidad: de lo más rápido a lo más lento, parando en el primer fallo,
# igual que composer ci:check. Una "sequence" de poe ejecuta las tareas en orden.
[tool.poe.tasks.check]
help = "Gate de calidad del servicio (como composer ci:check)"
sequence = ["format:check", "lint:check", "types:check", "test"]

# Arranque en local (como php artisan serve). Host y puerto configurables con
# variables de entorno; por defecto, solo en 127.0.0.1 (no se expone a la red)
# y en el 8001, para no chocar con el 8000 de php artisan serve.
[tool.poe.tasks.serve]
help = "Arranca el servicio en local con recarga automática"
cmd = "uvicorn importer.main:app --reload --host ${IMPORTER_HOST} --port ${IMPORTER_PORT}"
env = { IMPORTER_HOST.default = "127.0.0.1", IMPORTER_PORT.default = "8001" }

# ----------------------------------------------------------------------------
# ruff: formato (como Pint) y lint (reglas de estilo y errores probables)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W: estilo PEP 8 · F: pyflakes (nombres sin usar o sin definir)
# I: orden de los import · UP: sintaxis moderna de Python · B: bugbear (errores
# probables) · SIM: simplificaciones · N: nombres PEP 8 · RUF: reglas de ruff
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF"]
# La raya (–) y el guion largo (—) no son erratas: son los separadores de los
# intercambios en el Excel de la nutricionista (ADR 0022), y aparecen en el
# código que los reconoce y en sus tests.
allowed-confusables = ["–", "—"]

# ----------------------------------------------------------------------------
# mypy: comprobación estática de los type hints (como PHPStan)
# ----------------------------------------------------------------------------
# strict = true activa todas las comprobaciones opcionales: todo tiene que
# tener tipos y no se admite Any implícito. Es el equivalente a PHPStan "max".
[tool.mypy]
strict = true
files = ["src", "tests"]
# Plugin de Pydantic: mypy entiende los modelos (sus campos y su constructor).
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ----------------------------------------------------------------------------
# pytest (como phpunit.xml)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Falla si se usa un marcador no declarado o una opción mal escrita.
addopts = ["--strict-markers", "--strict-config"]
